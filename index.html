<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
     body {
    background-color: lightblue;
  }
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    .card1 {
      background-color: white;
      width: 300px;
      height: 500px;
      border-radius: 20px;
      margin: 0 auto;
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .card1 {
    animation: fadeIn 1s ease-in-out;
  }
  </style>
</head>
<body>
  <div class="card1">
    <img src="./images/image-qr-code.png" alt="QR Code" style="width: 100%; border-radius: 20px;">
    <h1 style="text-align: center; font-size: 24px; margin-top: 20px;">Git Practice</h1>
    <p style="text-align: center; color: gray;">Scan the QR code </p>
</div>
  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Drew</a>.
  </div>
</body>
</html>
